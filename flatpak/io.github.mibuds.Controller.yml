app-id: io.github.mibuds.Controller
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mibuds.sh
sdk-extensions:
  - org.freedesktop.Sdk.Extension.python3
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus
  - --socket=system-bus
  - --device=all
  - --share=network
  - --share=ipc
  - --env=PYTHONPATH=/app/mibuds-linux
build-options:
  append-path: /usr/lib/sdk/python3/bin
  env:
    PYTHONPATH: /app/lib/python3.12/site-packages
modules:
  - name: mibuds-linux
    buildsystem: simple
    build-commands:
      - install -Dm755 tray.py rcsp.py saferplus.py probe.py -t /app/mibuds-linux/
      - install -Dm755 mibuds.sh /app/mibuds-linux/mibuds.sh
      - |
        cat > /app/bin/mibuds.sh <<'INNER'
        #!/bin/sh
        export PYTHONPATH="/app/mibuds-linux:${PYTHONPATH:-}"
        exec python3 /app/mibuds-linux/tray.py "$@"
        INNER
      - chmod +x /app/bin/mibuds.sh
      - |
        cat > /app/share/applications/io.github.mibuds.Controller.desktop <<'DESK'
        [Desktop Entry]
        Type=Application
        Name=MiBuds Controller
        Comment=Xiaomi/Redmi earbuds battery and ANC controller
        Exec=mibuds.sh
        Icon=io.github.mibuds.Controller
        Terminal=false
        Categories=Utility;AudioVideo;
        DESK
      - install -Dm644 README.md /app/share/doc/mibuds-linux/README.md
    sources:
      - type: dir
        path: ..
        skip: [dist, __pycache__, tray.log, .git, .flatpak-builder, rpm/_build, deb/build, appimage/mibuds.AppDir]
