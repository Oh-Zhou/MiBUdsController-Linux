app-id: io.github.mibuds.Controller
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mibuds.sh
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus
  - --socket=system-bus
  - --device=all
  - --share=network
  - --share=ipc
modules:
  - name: mibuds-linux
    buildsystem: simple
    build-commands:
      - install -Dm755 tray.py rcsp.py saferplus.py probe.py mibuds.sh -t /app/mibuds-linux/
      - |
        cat > /app/bin/mibuds.sh <<'INNER'
        #!/bin/sh
        exec python3 /app/mibuds-linux/tray.py "$@"
        INNER
      - chmod +x /app/bin/mibuds.sh
      - install -Dm644 mibuds-controller.desktop /app/share/applications/io.github.mibuds.Controller.desktop
      - install -Dm644 README.md /app/share/doc/mibuds-linux/README.md
    sources:
      - type: dir
        path: ../../
        skip: [dist, __pycache__, tray.log, .git]
